services:
  postgres:
    image: postgres:17-alpine
    container_name: interview-prep-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prep}
      POSTGRES_DB: ${POSTGRES_DB:-prep}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prep} -d ${POSTGRES_DB:-prep}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
