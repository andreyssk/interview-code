<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Prep</title>
    <script>
      // Apply the saved theme before first paint so the page doesn't flash the default one.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'tokyo' || t === 'depressive' || t === 'cozy' || t === 'apple' || t === 'apple-dark' || t === 'android' || t === 'jetbrains') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500;700&family=Pangolin&family=Caveat:wght@500;700&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
